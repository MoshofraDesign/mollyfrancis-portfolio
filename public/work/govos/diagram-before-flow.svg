  <text x="1135" y="592" text-anchor="middle" font-size="26" font-weight="600" fill="#0B1F33">records dept.</text>

  <circle cx="1385" cy="470" r="58" fill="#FFFFFF" stroke="#0091CF" stroke-width="3"/>
