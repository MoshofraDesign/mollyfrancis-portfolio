  <path d="M 330 610 L 348 600 M 330 610 L 348 620" fill="none" stroke="#E4A45C" stroke-width="3" stroke-linecap="round"/>
  <text x="805" y="665" text-anchor="middle" font-size="22" font-weight="400" fill="#8A6A3E">Recorded / rejected documents route back the same way — through GovOS and the vendor</text>

  <circle cx="170" cy="470" r="58" fill="#FFFFFF" stroke="#0091CF" stroke-width="3"/>
  <g stroke="#0091CF" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="170" cy="452" r="14"/>
    <path d="M 143 495 Q 170 465 197 495"/>
  </g>
  <text x="170" y="565" text-anchor="middle" font-size="26" font-weight="600" fill="#0B1F33">Submitter</text>

  <circle cx="418" cy="470" r="58" fill="#FFFFFF" stroke="#0091CF" stroke-width="3"/>
  <g stroke="#0091CF" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="392" y="450" width="52" height="38" rx="4"/>
    <path d="M 392 462 L 444 462"/>
    <path d="M 410 488 L 410 500 M 426 488 L 426 500"/>
