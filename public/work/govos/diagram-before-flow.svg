  <line x1="500" y1="470" x2="605" y2="470" stroke="#B9C6D1" stroke-width="4"/>
  <path d="M 605 470 L 587 460 M 605 470 L 587 480" fill="none" stroke="#B9C6D1" stroke-width="4" stroke-linecap="round"/>
  <line x1="895" y1="470" x2="1000" y2="470" stroke="#B9C6D1" stroke-width="4"/>
  <path d="M 1000 470 L 982 460 M 1000 470 L 982 480" fill="none" stroke="#B9C6D1" stroke-width="4" stroke-linecap="round"/>
  <line x1="1170" y1="470" x2="1280" y2="470" stroke="#B9C6D1" stroke-width="4"/>
  <path d="M 1280 470 L 1262 460 M 1280 470 L 1262 480" fill="none" stroke="#B9C6D1" stroke-width="4" stroke-linecap="round"/>

