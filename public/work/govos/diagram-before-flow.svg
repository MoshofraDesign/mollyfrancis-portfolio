  <text x="680" y="150" text-anchor="middle" font-size="24" font-weight="400" fill="#55606B">To reach the submitter, the county has to go</text>
  <text x="680" y="182" text-anchor="middle" font-size="24" font-weight="400" fill="#55606B">back through the vendor — it can't serve them directly.</text>

  <line x1="230" y1="470" x2="330" y2="470" stroke="#B9C6D1" stroke-width="4"/>
