  <text x="750" y="600" text-anchor="middle" font-size="26" font-weight="600" fill="#0B1F33">eRecording portal</text>

  <circle cx="1135" cy="470" r="58" fill="#FFFFFF" stroke="#0091CF" stroke-width="3"/>
  <g stroke="#0091CF" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
