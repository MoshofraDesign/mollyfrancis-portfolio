<svg viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg" font-family="'Poppins','Century Gothic','Futura','Helvetica Neue',Arial,sans-serif">
  <rect width="1600" height="900" fill="#FFFFFF"/>

  <path d="M 460 250 C 560 150, 760 140, 900 235" fill="none" stroke="#B9C6D1" stroke-width="3" stroke-dasharray="2 10" stroke-linecap="round"/>
