  <text x="418" y="565" text-anchor="middle" font-size="26" font-weight="600" fill="#0B1F33">eRecording vendor</text>
  <text x="418" y="592" text-anchor="middle" font-size="19" font-style="italic" fill="#8B95A0">Simplifile, CSC, Indecomm, EPN</text>

  <circle cx="750" cy="470" r="88" fill="#0091CF"/>
  <g stroke="#FFFFFF" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="710" y="440" width="45" height="35" rx="3"/>
    <path d="M 733 475 L 733 488 M 718 488 L 748 488"/>
    <path d="M 762 448 L 790 448 L 790 480" />
